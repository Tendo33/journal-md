name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # 三个 to Markdown 插件共用这一段：lint → 双端构建 → 双端校验 → test → check:keys → zip。
  # test 放在 build 之后，与 arxiv-md 相同（那边 CI=true 时要检查 dist/_locales）。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run build:firefox
      - run: npm run verify:dist:chrome
      - run: npm run verify:dist:firefox
      - run: npm test
      - run: npm run check:keys
      - run: node scripts/package.js
      - uses: actions/upload-artifact@v4
        with:
          name: journal-md-packages
          path: |
            build/*-chrome.zip
            build/*-firefox.zip
            build/SHA256SUMS.txt
          if-no-files-found: error

  # 扩展冒烟（有界面的 Chromium + xvfb，网络全部 route 到 tests/fixtures）。
  # 本仓库不依赖 playwright，装到仓库外的临时目录，经 E2E_PLAYWRIGHT_DIR 交给脚本（同 arxiv-md）。
  e2e:
    runs-on: ubuntu-latest
    needs: build
    env:
      PLAYWRIGHT_VERSION: 1.60.0
      E2E_SCRIPTS: |
        scripts/e2e-smoke.js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-tools"
          cd "$RUNNER_TEMP/e2e-tools"
          npm init -y >/dev/null
          npm install --no-save --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
          sudo apt-get install -y xvfb fonts-noto-core
          echo "E2E_PLAYWRIGHT_DIR=$RUNNER_TEMP/e2e-tools" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(node -p "require('playwright').chromium.executablePath()")" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Run e2e scripts
        run: |
          set -e
          for s in $E2E_SCRIPTS; do
            echo "::group::$s"
            xvfb-run -a node "$s"
            echo "::endgroup::"
          done
        env:
          FONTCONFIG_FILE: ${{ github.workspace }}/scripts/e2e-fonts.conf
