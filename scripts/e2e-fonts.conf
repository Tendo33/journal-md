<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- e2e 专用：让 system-ui / sans-serif 解析到 Noto Sans（与 box 及 Chrome OS/Win/mac 系统字体宽度接近），
     避免 ubuntu-latest 默认回退到较宽的 DejaVu Sans 导致 320px 标题换行（design 检查误报）。 -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern"><test name="family"><string>sans-serif</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>system-ui</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Sans</string></edit></match>
</fontconfig>
