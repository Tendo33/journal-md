<!DOCTYPE html>
<html lang="en" data-brand="journal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Journal to Markdown</title>
  <!-- 系列共用骨架（arxiv-md / zhihu-md 同源）→ journal 品牌层 → popup 专有补充 -->
  <link rel="stylesheet" href="ui-v2.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="pop">
    <header class="hd">
      <div class="logo"><img src="assets/icon.svg" alt="" width="24" height="24"></div>
      <h1 data-i18n="popupHeading">Journal to Markdown</h1>
      <button id="settings" type="button" class="icon-btn" data-i18n-aria-label="linkSettings" data-i18n-title="linkSettings">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </header>

    <main class="body">
      <section class="card ctx" aria-labelledby="ctx-title">
        <p id="loading" class="m" data-i18n="popupLoading"></p>
        <div id="info" hidden>
          <span id="platform" class="badge ok"></span>
          <p id="ctx-title" class="t"></p>
          <dl class="kv">
            <div id="row-doi" hidden><dt>DOI</dt><dd id="doi"></dd></div>
            <div id="row-pmcid" hidden><dt>PMCID</dt><dd id="pmcid"></dd></div>
            <div id="row-pmid" hidden><dt>PMID</dt><dd id="pmid"></dd></div>
            <div><dt data-i18n="popupRoutes"></dt><dd id="routes" aria-live="polite"></dd></div>
          </dl>
        </div>
        <p id="empty" class="empty" role="alert" hidden></p>
      </section>

      <div id="actions" class="acts" hidden>
        <button id="export" type="button" class="btn btn-primary" data-i18n="btnExport" data-i18n-title="btnExportTitle"></button>
        <button id="copy" type="button" class="btn btn-secondary" data-i18n="btnCopy" data-i18n-title="btnCopyTitle"></button>
        <button id="zip" type="button" class="btn btn-secondary" data-i18n="btnZip" data-i18n-title="btnZipTitle"></button>
      </div>

      <div id="pdf-row" class="pdf-row" hidden>
        <button id="pdf" type="button" class="btn btn-secondary"></button>
        <p id="pdf-status" class="pdf-status" role="status" aria-live="polite"></p>
      </div>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </main>

    <footer class="ft">
      <span id="shortcuts"></span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
