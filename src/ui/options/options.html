<!DOCTYPE html>
<html lang="en" data-brand="journal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Journal to Markdown</title>
  <link rel="stylesheet" href="ui-v2.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="page">
    <header class="head">
      <img src="assets/icon.svg" alt="" width="32" height="32">
      <div class="brand-text">
        <h1 data-i18n="optTitle">Journal to Markdown settings</h1>
        <p id="version" class="sub"></p>
      </div>
    </header>

    <section id="welcome" class="welcome" aria-labelledby="welcome-title" hidden>
      <h2 id="welcome-title" data-i18n="optWelcomeTitle"></h2>
      <p data-i18n="optWelcomeBody"></p>
    </section>

    <section class="grp" aria-labelledby="sec-output">
      <h2 id="sec-output" data-i18n="optSectionOutput"></h2>
      <div class="it it-col">
        <label for="filename" class="lbl" data-i18n="optFilename"></label>
        <input id="filename" class="field" type="text" spellcheck="false" autocomplete="off" aria-describedby="filename-help filename-preview">
        <small id="filename-help" class="help" data-i18n="optFilenameHelp"></small>
        <small id="filename-preview" class="help preview"></small>
      </div>
      <div class="it">
        <div class="tx">
          <label for="includeImages" class="lbl" data-i18n="optIncludeImages"></label>
          <small id="includeImages-help" class="help" data-i18n="optIncludeImagesHelp"></small>
        </div>
        <span class="switch"><input id="includeImages" type="checkbox" role="switch" aria-describedby="includeImages-help"><span aria-hidden="true"></span></span>
      </div>
      <div class="it">
        <div class="tx">
          <label for="showFab" class="lbl" data-i18n="optShowFab"></label>
          <small id="showFab-help" class="help" data-i18n="optShowFabHelp"></small>
        </div>
        <span class="switch"><input id="showFab" type="checkbox" role="switch" aria-describedby="showFab-help"><span aria-hidden="true"></span></span>
      </div>
      <div class="it">
        <div class="tx">
          <label for="preferJats" class="lbl" data-i18n="optPreferJats"></label>
          <small id="preferJats-help" class="help" data-i18n="optPreferJatsHelp"></small>
        </div>
        <span class="switch"><input id="preferJats" type="checkbox" role="switch" aria-describedby="preferJats-help"><span aria-hidden="true"></span></span>
      </div>
    </section>

    <section class="grp" aria-labelledby="sec-language">
      <h2 id="sec-language" data-i18n="optSectionLanguage"></h2>
      <div class="it">
        <fieldset class="segmented" aria-labelledby="sec-language">
          <label><input type="radio" name="language" value="auto"><span data-i18n="optLangAuto"></span></label>
          <label><input type="radio" name="language" value="en"><span data-i18n="optLangEn"></span></label>
          <label><input type="radio" name="language" value="zh"><span data-i18n="optLangZh"></span></label>
        </fieldset>
      </div>
    </section>

    <section class="grp" aria-labelledby="sec-pdf">
      <h2 id="sec-pdf" data-i18n="optSectionPdf"></h2>
      <p class="grp-desc" data-i18n="optPdfHelp"></p>
      <div class="it it-col">
        <fieldset id="pdf-provider" class="segmented" aria-labelledby="pdf-provider-label">
          <legend id="pdf-provider-label" class="sr-only" data-i18n="optPdfProvider"></legend>
          <label><input type="radio" name="pdfProvider" value="paddleocr"><span data-i18n="optPdfPaddle"></span></label>
          <label><input type="radio" name="pdfProvider" value="mineru"><span data-i18n="optPdfMineru"></span></label>
        </fieldset>
        <small id="pdf-provider-note" class="help"></small>
      </div>
      <div class="it it-col">
        <label for="pdfToken" id="pdfToken-label" class="lbl"></label>
        <div class="token-row">
          <input id="pdfToken" class="field" type="password" spellcheck="false" autocomplete="off" aria-describedby="pdfToken-help pdf-status">
          <button id="pdfTest" type="button" class="btn btn-secondary" data-i18n="optPdfTest"></button>
        </div>
        <small id="pdfToken-help" class="help"><span data-i18n="optPdfTokenHelp"></span> <a id="pdfKeyLink" href="#" target="_blank" rel="noopener noreferrer" data-i18n="optPdfGetToken"></a></small>
        <p id="pdf-status" class="pdf-status" role="status" aria-live="polite"></p>
      </div>
    </section>

    <section class="grp" aria-labelledby="sec-sites">
      <h2 id="sec-sites" data-i18n="optSectionSites"></h2>
      <p class="grp-desc" data-i18n="optSitesHelp"></p>
      <ul id="sites" class="sites"></ul>
    </section>

    <footer class="foot">
      <p data-i18n="optPrivacy"></p>
      <p id="saved" class="saved" role="status" aria-live="polite"></p>
    </footer>
  </main>
  <script src="options.js"></script>
</body>
</html>
